.tf1 .hrt g{animation:tf1b 2.8s ease-in-out infinite;transform-origin:0 -1.5px}
@keyframes tf1b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
/* пункты: время крупно, событие капителью — как в референсе */
.tf1 .it{position:absolute;transform:translateY(-50%);white-space:nowrap;transition:opacity .9s var(--ease)}
.tf1 .it.r{text-align:right}

.tf1-js .tf1.armed .it:not(.on){opacity:.3}

.tf1-js .tf1 .ttl{-webkit-mask-image:linear-gradient(90deg,#000 45%,transparent 55%);mask-image:linear-gradient(90deg,#000 45%,transparent 55%);-webkit-mask-size:240% 100%;mask-size:240% 100%;-webkit-mask-position:100% 0;mask-position:100% 0;transition:-webkit-mask-position 1.8s cubic-bezier(.45,.05,.3,1) .2s,mask-position 1.8s cubic-bezier(.45,.05,.3,1) .2s}
