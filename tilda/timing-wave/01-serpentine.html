.tw1{--bg:#F6F1EA;--choc:#2E221C;--ink:#4A3A31;--latte:#8C7566;--line:#CDBBAA;--ease:cubic-bezier(.22,.68,.18,1);

.tw1 *,.tw1 *::before,.tw1 *::after{box-sizing:border-box}
.tw1 :where(p,h2,ol,li){margin:0;padding:0;list-style:none;font-weight:inherit}

/* заголовок: рукописный, по левому краю; поля дают место росчеркам при анимации-маске */
.tw1 .ttl{display:inline-block;padding:.32em .3em .22em;margin:-.32em 0 -.22em -.3em;font-family:var(--script);font-weight:400;line-height:1;color:var(--choc);font-size:clamp(50px,15.5vw,72px);white-space:nowrap}
/* сцена: ширина ограничена и высотой экрана — к концу прокрутки весь блок помещается на один экран */
.tw1 .stage{position:relative;width:min(100%,calc((100vh - 170px) * 0.8));width:min(100%,calc((100svh - 170px) * 0.8));margin:8px auto 0;container-type:inline-size}
.tw1 svg{display:block;width:100%;height:auto;overflow:visible}
.tw1 .base{fill:none;stroke:var(--line);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.tw1 .done{fill:none;stroke:var(--choc);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.tw1 .hrt path{fill:var(--choc);stroke:var(--bg);stroke-width:3;paint-order:stroke;stroke-linejoin:round}
.tw1 .hrt g{animation:tw1b 2.6s ease-in-out infinite;transform-origin:0 -1.5px}
@keyframes tw1b{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
/* пункты */
.tw1 .it{position:absolute;transform:translate(var(--tx),-50%);white-space:nowrap}
.tw1 .it.right{text-align:right}.tw1 .it.center{text-align:center}
.tw1 .tm{font-size:28px;font-size:8.4cqw;line-height:1;font-weight:400;font-variant-numeric:lining-nums tabular-nums;letter-spacing:.02em;color:var(--choc)}
.tw1 .ev{margin-top:7px;font-size:11.5px;font-size:max(10px,3.35cqw);letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--ink)}
.tw1 .it{transition:opacity .8s var(--ease),transform .8s var(--ease)}
.tw1-js .tw1.armed .it:not(.on){opacity:.32}

.tw1-js .tw1 .ttl{-webkit-mask-image:linear-gradient(90deg,#000 45%,transparent 55%);mask-image:linear-gradient(90deg,#000 45%,transparent 55%);-webkit-mask-size:240% 100%;mask-size:240% 100%;-webkit-mask-position:100% 0;mask-position:100% 0;transition:-webkit-mask-position 1.8s cubic-bezier(.45,.05,.3,1) .2s,mask-position 1.8s cubic-bezier(.45,.05,.3,1) .2s}
.tw1-js .tw1.tw1-on .ttl{-webkit-mask-position:0 0;mask-position:0 0}
@media (prefers-reduced-motion:reduce){.tw1 *{animation:none!important;transition-duration:.01s!important}}

<script>(function(){var d=document;
/* сердечко едет по линии вместе с прокруткой: старт — когда видно ~30% блока, финиш — когда блок виден целиком */
function init(s){if(s.__tw)return;s.__tw=1;var base=s.querySelector('.base'),done=s.querySelector('.done'),h=s.querySelector('.hrt'),its=s.querySelectorAll('.it'),st=s.querySelectorAll('.stp');
if(!base.getTotalLength)return;var T=base.getTotalLength(),N=500,pts=[],i;for(i=0;i<=N;i++){var q=base.getPointAtLength(T*i/N);pts.push([q.x,q.y,T*i/N])}
function near(x,y){var b=0,bd=1e9;for(var j=0;j<pts.length;j++){var dx=pts[j][0]-x,dy=pts[j][1]-y,dd=dx*dx+dy*dy;if(dd<bd){bd=dd;b=pts[j][2]}}return b}
var A=[[348,76],[12,176],[348,276],[12,376]],S=[236,426],END=near(S[0],S[1]),START=6,at=A.map(function(a){return near(a[0],a[1])});
done.setAttribute('d',base.getAttribute('d'));done.style.strokeDasharray=T+' '+T;s.classList.add('armed');
var cur=-1,raf=0,rm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function place(L){var q=base.getPointAtLength(L);h.setAttribute('transform','translate('+q.x.toFixed(2)+' '+q.y.toFixed(2)+')');done.style.strokeDashoffset=(T-L).toFixed(2);
for(var k=0;k<its.length;k++){its[k].classList.toggle('on',L>=at[k]-14);if(st[k])st[k].classList.toggle('on',L>=at[k]-2)}}
function target(){var r=s.getBoundingClientRect(),vh=window.innerHeight||d.documentElement.clientHeight,hh=r.height,m=.3*Math.min(hh,vh),p=(vh-r.top-m)/Math.max(1,hh-m);p=Math.max(0,Math.min(1,p));return START+(END-START)*p}
function tick(){raf=0;var t=target();if(cur<0||rm)cur=t;else cur+=(t-cur)*.14;place(cur);if(Math.abs(t-cur)>.3)raf=requestAnimationFrame(tick)}
