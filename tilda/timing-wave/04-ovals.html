.tw4 svg{display:block;width:100%;height:auto;overflow:visible}
.tw4 .base{fill:none;stroke:var(--line);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}

.tw4 .hrt path{fill:var(--choc);stroke:var(--bg);stroke-width:3;paint-order:stroke;stroke-linejoin:round}
.tw4 .hrt g{animation:tw4b 2.6s ease-in-out infinite;transform-origin:0 -1.5px}
@keyframes tw4b{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
/* пункты */
.tw4 .it{position:absolute;transform:translate(var(--tx),-50%);white-space:nowrap}
.tw4 .it.right{text-align:right}.tw4 .it.center{text-align:center}
.tw4 .tm{font-size:28px;font-size:8.4cqw;line-height:1;font-weight:400;font-variant-numeric:lining-nums tabular-nums;letter-spacing:.02em;color:var(--choc)}
.tw4 .ev{margin-top:7px;font-size:11.5px;font-size:max(10px,3.35cqw);letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--ink)}
.tw4 .it{transition:opacity .8s var(--ease),transform .8s var(--ease)}
.tw4-js .tw4.armed .it:not(.on){opacity:.32}

.tw4 .ev{font-size:10.5px;font-size:max(9px,3.05cqw);letter-spacing:.14em}
.tw4-js .tw4 .ttl{-webkit-mask-image:linear-gradient(90deg,#000 45%,transparent 55%);mask-image:linear-gradient(90deg,#000 45%,transparent 55%);-webkit-mask-size:240% 100%;mask-size:240% 100%;-webkit-mask-position:100% 0;mask-position:100% 0;transition:-webkit-mask-position 1.8s cubic-bezier(.45,.05,.3,1) .2s,mask-position 1.8s cubic-bezier(.45,.05,.3,1) .2s}
.tw4-js .tw4.tw4-on .ttl{-webkit-mask-position:0 0;mask-position:0 0}
