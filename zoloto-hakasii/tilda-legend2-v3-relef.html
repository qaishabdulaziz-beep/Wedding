  background:linear-gradient(100deg,rgba(255,236,196,0) 38%,rgba(255,236,196,.95) 50%,rgba(255,236,196,0) 62%) 100% 0/300% 100% no-repeat;-webkit-background-clip:text;background-clip:text}

.lr3__more::after{content:'';position:absolute;left:0;bottom:0;width:44px;height:1px;background:var(--au);transition:width .8s var(--e)}

/* Анимация: один раз при появлении; при reduced-motion всё видно сразу */
.lr3.is-armed .lr3__kick-t{opacity:0}
.lr3.is-armed .lr3__rule{transform:scaleX(0)}
.lr3.is-armed .lr3__ln{opacity:0;filter:blur(6px);transform:translateY(10px)}

.lr3.is-armed .lr3__more{opacity:0;transform:translateY(6px)}
.lr3.is-armed .lr3__ridges .ln{stroke-dasharray:1;stroke-dashoffset:1}

.lr3.is-in .lr3__ln:nth-child(3){transition-delay:1.9s}
.lr3.is-in .lr3__ln:nth-child(4){transition-delay:2.4s}
.lr3.is-in .lr3__ln:nth-child(5){transition-delay:2.9s}
.lr3.is-in .lr3__acc{color:var(--au);transition:color 1.6s ease 2.6s}
.lr3.is-in .lr3__acc::after{animation:lr3Sweep 1.8s var(--e) 2.9s 1 both}

@media (min-width:700px) and (max-width:1279px){.lr3__br{display:inline}}

.lr3{--low:#1A1714;background:
  radial-gradient(40% 70% at 72% 100%,rgba(214,150,70,.14) 0%,rgba(214,150,70,0) 72%),
  linear-gradient(180deg,var(--seam) 0%,var(--low) 46%,var(--low) 100%);

  .lr3__more{margin-top:36px}
}

<div class="lr3__in">
  <p class="lr3__kick" id="lr3-h"><span class="lr3__kick-t">Легенда</span><i class="lr3__rule" aria-hidden="true"></i></p>
  <div class="lr3__txt">
    <p class="lr3__ln">Две с&nbsp;половиной тысячи лет назад <br class="lr3__br">в&nbsp;этой степи жили люди скифского мира.</p>
    <p class="lr3__ln">Золото для&nbsp;них было <span class="lr3__acc" data-t="не&nbsp;богатством, а&nbsp;светом">не&nbsp;богатством, а&nbsp;светом</span>.</p>
    <p class="lr3__ln">Его носили, чтобы солнце было рядом.</p>
    <p class="lr3__ln">С&nbsp;ним уходили в&nbsp;последний путь, <br class="lr3__br">чтобы душа нашла дорогу.</p>
    <p class="lr3__ln">Мы берём золото из&nbsp;той&nbsp;же земли <br class="lr3__br">и&nbsp;возвращаем ему&nbsp;форму.</p>
  </div>
