<script>
(function(){
  var r=document.querySelector('.zh5');if(!r||r.dataset.ready)return;r.dataset.ready='1';
  var v=r.querySelector('video'),d=matchMedia('(min-width:1024px)'),c=matchMedia('(prefers-reduced-motion: reduce)'),loaded=false;
  v.muted=true;
  function play(){var x=v.play();if(x&&x.catch)x.catch(function(){});}
  function sync(){
    if(d.matches&&!c.matches){
      if(!loaded){r.querySelectorAll('source[data-src]').forEach(function(s){s.src=s.getAttribute('data-src');});v.load();loaded=true;}
      play();
    }else if(!v.paused)v.pause();
  }
  v.addEventListener('playing',function(){v.classList.add('is-on');});
  sync();d.addEventListener('change',sync);c.addEventListener('change',sync);
  if('IntersectionObserver' in window)new IntersectionObserver(function(e){if(!loaded)return;e[0].isIntersecting?play():v.pause();}).observe(r);
})();
