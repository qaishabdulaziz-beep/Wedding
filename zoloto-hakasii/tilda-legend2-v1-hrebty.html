/* Анимация: один раз при появлении; при reduced-motion всё видно сразу */
.lr1.is-armed .lr1__kick-t{opacity:0}
.lr1.is-armed .lr1__rule{transform:scaleX(0)}
.lr1.is-armed .lr1__ln{opacity:0;filter:blur(6px);transform:translateY(10px)}

.lr1.is-armed .lr1__more{opacity:0;transform:translateY(6px)}
.lr1.is-armed .lr1__ridges .ln{stroke-dasharray:1;stroke-dashoffset:1}
.lr1.is-in .lr1__kick-t{opacity:1;transition:opacity 1s var(--e) .1s}
.lr1.is-in .lr1__rule{transform:none;transition:transform 1.2s var(--e) .5s}

.lr1.is-in .lr1__ln:nth-child(2){transition-delay:1.4s}
.lr1.is-in .lr1__ln:nth-child(3){transition-delay:1.9s}
.lr1.is-in .lr1__ln:nth-child(4){transition-delay:2.4s}
.lr1.is-in .lr1__ln:nth-child(5){transition-delay:2.9s}
.lr1.is-in .lr1__acc{color:var(--au);transition:color 1.6s ease 2.6s}
.lr1.is-in .lr1__acc::after{animation:lr1Sweep 1.8s var(--e) 2.9s 1 both}
