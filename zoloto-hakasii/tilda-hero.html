<style>
.zh-hero, .zh-hero *, .zh-hero *::before, .zh-hero *::after { box-sizing: border-box; margin: 0; padding: 0; }
.zh-hero a { text-decoration: none; border: 0; box-shadow: none; }

.zh-hero {
  --g: #2B2B2B; --m: #E6D2B4; --au: #D4A24F; --au2: #E0B66A; --iv: #F7F2E7;
  --serif: 'Cormorant Garamond', 'Times New Roman', serif;
  --sans: 'Manrope', Arial, sans-serif;
  --out: cubic-bezier(.16, 1, .3, 1);
  position: relative;
  width: 100%;
  height: 100vh;
  min-height: 640px;
  overflow: hidden;
  background: var(--g);
  color: var(--iv);
  font-family: var(--sans); font-weight: 300;
  -webkit-font-smoothing: antialiased;
  isolation: isolate;
}

/* ── Видео / постер (компьютер) ── */
.zh-hero__media { position: absolute; inset: 0; z-index: 0; overflow: hidden; animation: zhFade 1.4s var(--out) both; }
/* Видео выше экрана на 10 % и прижато к верху — полоса с водяным знаком снизу обрезается */
.zh-hero__video, .zh-hero__poster {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 110%;
  object-fit: cover; object-position: right top;
  display: block; max-width: none;
}
.zh-hero__poster { z-index: 0; }
.zh-hero__video  { z-index: 1; }
/* Градиент для читаемости текста */
.zh-hero__media::after {
  content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none;
  background: linear-gradient(90deg, rgba(43,43,43,.85) 0%, rgba(43,43,43,.55) 28%, rgba(43,43,43,0) 50%);
}
.zh-hero__photo { display: none; }

/* ── Текст ── */
.zh-hero__content {
  position: relative; z-index: 3;
  height: 100%;
  display: flex; flex-direction: column; justify-content: center;
  padding: calc(88px + 8vh) 0 6vh clamp(64px, 8.4vw, 120px);
  width: min(50%, 760px); min-width: 480px;
}
.zh-hero__eyebrow {
  margin-bottom: 24px;
  font-family: var(--sans); font-size: 12px; font-weight: 400; line-height: 1.5;
  letter-spacing: .2em; text-transform: uppercase; color: var(--au);
}
.zh-hero__title {
  font-family: var(--serif); font-weight: 300;
  font-size: clamp(44px, 4.4vw, 64px); line-height: 1.1; letter-spacing: .005em;
  color: var(--iv);
}
.zh-hero__title span { display: block; white-space: nowrap; }
.zh-hero__rule { width: 60px; height: 1px; margin: 24px 0; background: var(--au); }
.zh-hero__lead {
  font-family: var(--sans); font-size: 18px; font-weight: 300; line-height: 1.55;
  color: var(--m); text-wrap: balance;
}
.zh-hero__actions { display: flex; flex-wrap: wrap; align-items: center; gap: 24px; margin-top: 40px; }
.zh-btn {
  display: inline-flex; align-items: center; justify-content: center;
  height: 52px; padding: 0 32px;
  font-family: var(--sans); font-size: 13px; font-weight: 500; line-height: 1;
  letter-spacing: .15em; text-transform: uppercase; white-space: nowrap;
  transition: background-color .3s ease, color .3s ease;
}
.zh-btn--primary { background: var(--au); color: var(--g) !important; border-radius: 2px; }
.zh-btn--primary:hover { background: var(--au2); }
.zh-btn--text { position: relative; padding: 0 2px; color: var(--iv) !important; font-weight: 400; }
.zh-btn--text::after {
  content: ''; position: absolute; left: 2px; right: 2px; bottom: 14px; height: 1px; background: currentColor;
}
.zh-btn--text:hover { color: var(--au) !important; }

/* ── Этикетка изделия ── */
.zh-hero__label {
  position: absolute; z-index: 3; right: 48px; bottom: 48px;
  font-family: var(--sans); font-size: 11px; font-weight: 400;
  letter-spacing: .15em; text-transform: uppercase;
  color: rgba(230, 210, 180, .7) !important;
  transition: color .3s ease;
}
.zh-hero__label:hover { color: var(--m) !important; }

/* ── Линия «листайте» ── */
.zh-hero__scroll {
  position: absolute; z-index: 3; left: 50%; bottom: 32px;
  width: 1px; height: 40px; margin-left: -.5px; overflow: hidden;
  background: rgba(247, 242, 231, .12);
}
.zh-hero__scroll::before {
  content: ''; position: absolute; left: 0; top: 0; width: 1px; height: 100%;
  background: rgba(247, 242, 231, .4);
  animation: zhScroll 2.6s cubic-bezier(.65, 0, .35, 1) infinite;
}

/* ── Появление ── */
@keyframes zhRise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes zhFade { from { opacity: 0; } to { opacity: 1; } }
@keyframes zhScroll { 0% { transform: translateY(-100%); } 60%, 100% { transform: translateY(100%); } }
@keyframes zhZoom { from { transform: scale(1); } to { transform: scale(1.04); } }
.zh-hero__eyebrow, .zh-hero__title, .zh-hero__rule, .zh-hero__lead, .zh-hero__actions { animation: zhRise .8s var(--out) both; }
.zh-hero__eyebrow { animation-delay: .15s; }
.zh-hero__title   { animation-delay: .30s; }
.zh-hero__rule    { animation-delay: .45s; }
.zh-hero__lead    { animation-delay: .60s; }
.zh-hero__actions { animation-delay: .75s; }
.zh-hero__label, .zh-hero__scroll { animation: zhFade 1.2s var(--out) 1.1s both; }

/* ── Телефон и планшет ── */
@media (max-width: 1023px) {
  .zh-hero { height: 100vh; height: 100svh; min-height: 600px; }
  .zh-hero__video, .zh-hero__poster, .zh-hero__media::after { display: none; }
  .zh-hero__photo {
    display: block; position: absolute; left: 0; right: 0; bottom: 0;
    width: 100%; aspect-ratio: 1122 / 1402; max-height: 100%;
    background-image:
      url('https://cdn.jsdelivr.net/gh/qaishabdulaziz-beep/Wedding@fc3c283611b5a7b6eb4f32f0cc50456d8fac76fc/zoloto-hakasii/hero-mobile.jpg'),
      url('https://raw.githubusercontent.com/qaishabdulaziz-beep/Wedding/fc3c283611b5a7b6eb4f32f0cc50456d8fac76fc/zoloto-hakasii/hero-mobile.jpg');
    background-position: center bottom; background-size: cover; background-repeat: no-repeat;
    transform-origin: 50% 100%;
    animation: zhZoom 12s linear both;
  }
  .zh-hero__photo::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, #2B2B2B 0%, rgba(43,43,43,0) 30%);
  }
  .zh-hero__content { display: block; width: 100%; min-width: 0; height: auto; padding: 120px 24px 0; }
  .zh-hero__eyebrow { font-size: 11px; margin-bottom: 18px; }
  .zh-hero__title { font-size: clamp(32px, 9.4vw, 36px); }
  .zh-hero__title span { white-space: normal; }
  .zh-hero__lead { font-size: 16px; }
  .zh-hero__actions { flex-direction: column; align-items: stretch; gap: 8px; margin-top: 32px; }
  .zh-btn { width: 100%; }
  .zh-btn--text::after { left: 50%; right: auto; width: 120px; margin-left: -60px; }
  .zh-hero__label, .zh-hero__scroll { display: none; }
}
@media (min-width: 600px) and (max-width: 1023px) {
  .zh-hero__content { max-width: 480px; padding-left: 40px; }
  .zh-hero__actions { flex-direction: row; align-items: center; gap: 24px; }
  .zh-btn { width: auto; }
  .zh-btn--text::after { left: 2px; right: 2px; width: auto; margin-left: 0; }
}
@media (min-width: 600px) and (max-width: 1023px) and (orientation: landscape) {
  .zh-hero__photo { max-height: 72%; }
}
@media (max-width: 599px) and (max-height: 700px) {
  .zh-hero__content { padding-top: 96px; }
  .zh-hero__actions { margin-top: 24px; }
}
@media (prefers-reduced-motion: reduce) {
  .zh-hero, .zh-hero * , .zh-hero *::before, .zh-hero *::after {
    animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important;
  }
  .zh-hero__video { display: none; }
}
</style>

<section class="zh-hero" aria-labelledby="zh-hero-title">

  <div class="zh-hero__media" aria-hidden="true">
    <!-- Постер: первый кадр видео, виден до загрузки и при сбое -->
    <img class="zh-hero__poster" alt=""
         src="https://cdn.jsdelivr.net/gh/qaishabdulaziz-beep/Wedding@fc3c283611b5a7b6eb4f32f0cc50456d8fac76fc/zoloto-hakasii/hero-poster.jpg"
         onerror="this.onerror=null;this.src='https://raw.githubusercontent.com/qaishabdulaziz-beep/Wedding/fc3c283611b5a7b6eb4f32f0cc50456d8fac76fc/zoloto-hakasii/hero-poster.jpg'">
    <!-- Видео: подключается скриптом только на компьютере -->
    <video class="zh-hero__video" autoplay muted loop playsinline preload="none"
           disablepictureinpicture disableremoteplayback tabindex="-1">
      <source data-src="https://cdn.jsdelivr.net/gh/qaishabdulaziz-beep/Wedding@fc3c283611b5a7b6eb4f32f0cc50456d8fac76fc/zoloto-hakasii/hero-video.mp4" type="video/mp4">
      <source data-src="https://raw.githubusercontent.com/qaishabdulaziz-beep/Wedding/fc3c283611b5a7b6eb4f32f0cc50456d8fac76fc/zoloto-hakasii/hero-video.mp4" type="video/mp4">
    </video>
    <div class="zh-hero__photo"></div>
  </div>

  <div class="zh-hero__content">
    <p class="zh-hero__eyebrow">Золото 585 · Ручная работа · Хакасия</p>
    <h1 class="zh-hero__title" id="zh-hero-title">
      <span>Предки верили:</span>
      <span>в золоте живёт солнце</span>
    </h1>
    <div class="zh-hero__rule"></div>
    <p class="zh-hero__lead">Украшения ручной работы из золота Хакасии</p>
    <div class="zh-hero__actions">
      <a class="zh-btn zh-btn--primary" href="/catalog">Смотреть коллекции</a>
      <a class="zh-btn zh-btn--text" href="/legends">Легенда бренда</a>
    </div>
  </div>

  <a class="zh-hero__label" href="/catalog">Перстень «Путь» · Легенды курганов&nbsp;→</a>
  <span class="zh-hero__scroll" aria-hidden="true"></span>
</section>

<script>
(function () {
  var hero = document.querySelector('.zh-hero');
  if (!hero || hero.dataset.ready) return;
  hero.dataset.ready = '1';

  var video = hero.querySelector('.zh-hero__video');
  var desktop = window.matchMedia('(min-width: 1024px)');
  var calm = window.matchMedia('(prefers-reduced-motion: reduce)');
  var loaded = false;

  video.muted = true;
  video.volume = 0;
  video.style.opacity = '0';
  video.style.transition = 'opacity .8s ease';

  function play() {
    var p = video.play();
    if (p && p.catch) p.catch(function () {});
  }

  function sync() {
    if (desktop.matches && !calm.matches) {
      if (!loaded) {
        hero.querySelectorAll('source[data-src]').forEach(function (s) { s.src = s.getAttribute('data-src'); });
        video.load();
        loaded = true;
      }
      play();
    } else if (!video.paused) {
      video.pause();
    }
  }

  /* Видео проявляется поверх постера, когда начало играть */
  video.addEventListener('playing', function () { video.style.opacity = '1'; });

  sync();
  desktop.addEventListener('change', sync);
  calm.addEventListener('change', sync);

  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (entries) {
      if (!loaded) return;
      if (entries[0].isIntersecting) play(); else video.pause();
    }).observe(hero);
  }
})();
</script>
